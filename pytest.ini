[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    unit: Unit-level tests for individual modules and functions.
    integration: Integration tests that exercise Speakeasy or cross-module flows.
    speakeasy: Tests that require the Speakeasy emulation engine.
    tight_loop: Tests for tight-loop and constrained emulation scenarios.
